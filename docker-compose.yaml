services:
  web:
    build:
      context: .
      dockerfile: web-Dockerfile
    container_name: analog-youtube-web
    ports:
      - "8000:8000"
    restart: unless-stopped
    
  scanner:
    build:
      dockerfile: scanner-Dockerfile
    container_name: analog-youtube-scanner
    command: python -m src.qr_listener.listener
    restart: unless-stopped

    # devices:
    # - /dev/ttyACM0:/dev/ttyACM0

    environment:
      PLAY_ENDPOINT: http://web:8000/api/play
    
    depends_on:
      - web
  