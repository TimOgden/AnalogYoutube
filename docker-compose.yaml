services:
  web:
    build:
      context: .
      dockerfile: web-Dockerfile
    container_name: analog-youtube-web
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    
  scanner:
    build:
      dockerfile: scanner-Dockerfile
    container_name: analog-youtube-scanner
    restart: unless-stopped

    devices:
    - /dev/ttyACM0:/dev/ttyACM0
    - /dev/cec0:/dev/cec0

    environment:
      PLAY_ENDPOINT: http://web:8000/api/play
      INPUT_DEVICE: /dev/ttyACM0
      SCANNER_MODE: serial
    
    depends_on:
      - web
  