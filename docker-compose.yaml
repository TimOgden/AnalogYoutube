services:
  web:
    build:
      context: .
      dockerfile: web-Dockerfile
    container_name: analog-youtube-web
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    
  scanner:
    build:
      dockerfile: devices-Dockerfile
    container_name: analog-youtube-scanner
    command: python -m src.qr_listener.listener
    restart: unless-stopped

    devices:
    - /dev/ttyACM0:/dev/ttyACM0
    - /dev/cec0:/dev/cec0

    environment:
      PLAY_ENDPOINT: http://web:8000/api/play
      INPUT_DEVICE: /dev/ttyACM0
      SCANNER_MODE: serial
    
    depends_on:
      - web
  
  remote:
    build:
      dockerfile: devices-Dockerfile
    container_name: analog-youtube-remote
    command: python -m src.remote_listener.listener
    restart: unless-stopped

    devices:
    - /dev/input/event0:/dev/input/event0

    environment:
      COMMANDS_ENDPOINT: http://web:8000/api/control
      INPUT_DEVICE: /dev/input/by-id/usb-XING_WEI_2.4G_USB_USB_Composite_Device-if02-event-kbd
  
    depends_on:
      - web
  